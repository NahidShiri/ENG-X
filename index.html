<title>ENG-X Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F5F5F5;
    --surface-2:#FFFFFF;
    --border:#E5E5E5;
    --text:#0A0A0A;
    --text-muted:#525252;
    --text-soft:#737373;
    --red:#F01414;
    --red-ink:#0A0A0A;
    --header-bg:#0A0A0A;
    --header-text:#FFFFFF;
    --header-muted:#B3B3B3;
    --header-border:#262626;
    --focus:#0A0A0A;
    --shadow: 0 1px 0 rgba(10,10,10,0.04);
    --maxw: 1200px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0A0A;
      --surface:#171717;
      --surface-2:#141414;
      --border:#333333;
      --text:#FFFFFF;
      --text-muted:#B3B3B3;
      --text-soft:#8A8A8A;
      --red-ink:#0A0A0A;
      --header-bg:#000000;
      --header-text:#FFFFFF;
      --header-muted:#9A9A9A;
      --header-border:#262626;
      --focus:#FFFFFF;
      --shadow: 0 1px 0 rgba(255,255,255,0.06);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0A0A;
    --surface:#171717;
    --surface-2:#141414;
    --border:#333333;
    --text:#FFFFFF;
    --text-muted:#B3B3B3;
    --text-soft:#8A8A8A;
    --red-ink:#0A0A0A;
    --header-bg:#000000;
    --header-text:#FFFFFF;
    --header-muted:#9A9A9A;
    --header-border:#262626;
    --focus:#FFFFFF;
    --shadow: 0 1px 0 rgba(255,255,255,0.06);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}
  h1,h2,h3,h4{
    font-family:'Inter Tight','Inter',sans-serif;
    line-height:1.12;
    text-wrap:balance;
    margin:0;
  }
  p{margin:0;}
  a{color:inherit;}
  ul{margin:0;padding:0;list-style:none;}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  html{scroll-behavior:smooth;}

  .wrap{max-width:var(--maxw); margin:0 auto; padding-inline:24px;}
  @media (max-width:640px){ .wrap{padding-inline:16px;} }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--red);
  }
  .eyebrow::before{content:""; width:16px; height:2px; background:var(--red); display:inline-block;}

  /* ---------- Logo ---------- */
  .logo{display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:inherit;}
  .logo-mark{width:26px; height:26px; flex:none;}
  .logo-word{font-family:'Inter Tight','Inter',sans-serif; font-weight:800; font-size:19px; letter-spacing:-0.01em;}
  .logo-word sup{color:var(--red); font-size:0.62em; font-weight:800; margin-left:1px; top:-0.9em;}

  /* ---------- Header ---------- */
  header.site{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:var(--header-bg); color:var(--header-text);
    border-bottom:1px solid var(--header-border);
    box-shadow:0 0 0 rgba(0,0,0,0);
    transition: box-shadow .25s ease, border-color .25s ease;
  }
  header.site.scrolled{
    box-shadow:0 8px 24px rgba(0,0,0,.28);
    border-bottom-color:transparent;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:14px;}
  .header-row .logo{color:var(--header-text);}
  nav.primary{display:flex; align-items:center; gap:4px;}
  nav.primary a{
    position:relative;
    padding:8px 12px; font-size:13.5px; font-weight:600; color:var(--header-muted);
    text-decoration:none; border-radius:2px; transition:color .15s ease;
    white-space:nowrap;
  }
  nav.primary a::after{
    content:""; position:absolute; left:12px; right:12px; bottom:4px; height:2px;
    background:var(--red); transform:scaleX(0); transform-origin:left;
    transition:transform .22s cubic-bezier(.2,0,0,1);
  }
  nav.primary a:hover{color:var(--header-text);}
  nav.primary a:hover::after{transform:scaleX(1);}
  .header-actions{display:flex; align-items:center; gap:10px;}

  .langswitch{display:flex; border:1px solid var(--header-border); border-radius:3px; overflow:hidden;}
  .langswitch button{
    background:transparent; color:var(--header-muted); border:0; padding:6px 9px;
    font-size:12px; font-weight:700; letter-spacing:.03em; cursor:pointer;
  }
  .langswitch button + button{border-left:1px solid var(--header-border);}
  .langswitch button[aria-pressed="true"]{background:var(--red); color:var(--red-ink);}
  .langswitch button{transition:background .15s ease, color .15s ease;}
  .langswitch button:hover:not([aria-pressed="true"]){color:var(--header-text);}

  main{ transition: opacity .18s ease; }
  main.lang-fade{ opacity:.4; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 20px; font-size:14px; font-weight:700; text-decoration:none;
    border-radius:2px; border:1.5px solid transparent; cursor:pointer;
    height:48px; white-space:nowrap;
    transition: transform .18s cubic-bezier(.2,0,0,1), box-shadow .18s ease, filter .18s ease, border-color .18s ease;
  }
  .btn-primary{background:var(--red); color:var(--red-ink);}
  .btn-primary:hover{filter:brightness(1.06); transform:translateY(-2px); box-shadow:0 10px 20px rgba(240,20,20,.28);}
  .btn-primary:active{transform:translateY(0); box-shadow:none;}
  .btn-outline-dark{background:transparent; color:var(--header-text); border-color:var(--header-border);}
  .btn-outline-dark:hover{border-color:var(--header-text); transform:translateY(-2px);}
  .btn-outline{background:transparent; color:var(--text); border-color:var(--border);}
  .btn-outline:hover{border-color:var(--red); color:var(--red); transform:translateY(-2px);}
  .btn-block{width:100%;}
  .btn-sm{height:40px; padding:0 16px; font-size:13px;}

  .navtoggle{
    display:none; background:transparent; border:1px solid var(--header-border); color:var(--header-text);
    width:40px; height:40px; border-radius:3px; cursor:pointer; align-items:center; justify-content:center;
  }
  .navtoggle svg{width:18px; height:18px;}

  @media (max-width:900px){
    nav.primary{
      position:absolute; top:100%; left:0; right:0; background:var(--header-bg);
      border-bottom:1px solid var(--header-border);
      flex-direction:column; align-items:stretch; padding:0 8px; gap:0;
      max-height:0; opacity:0; overflow:hidden; pointer-events:none;
      transition: max-height .32s cubic-bezier(.2,0,0,1), opacity .22s ease, padding .32s ease;
    }
    nav.primary.open{max-height:420px; opacity:1; padding:8px; pointer-events:auto;}
    nav.primary a{padding:12px 10px; border-radius:2px;}
    nav.primary a::after{display:none;}
    .navtoggle{display:inline-flex;}
    .navtoggle svg{transition:transform .25s cubic-bezier(.2,0,0,1);}
    .navtoggle[aria-expanded="true"] svg{transform:rotate(90deg);}
    .header-row{position:relative;}
    .cta-desktop{display:none;}
  }

  /* ---------- Hero ---------- */
  .hero{
    background:var(--header-bg); color:var(--header-text);
    position:relative; overflow:hidden;
    clip-path: polygon(0 0, 100% 0, 100% 92%, 0 100%);
    padding-bottom:64px;
  }
  .hero::after{
    content:""; position:absolute; right:-8%; top:-20%; width:60%; height:140%;
    background: linear-gradient(135deg, transparent 46%, var(--red) 46%, var(--red) 47.4%, transparent 47.4%),
                linear-gradient(135deg, transparent 56%, #262626 56%, #262626 58%, transparent 58%);
    opacity:.9; pointer-events:none;
    animation: hero-drift 10s ease-in-out infinite;
  }
  @keyframes hero-drift{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(-2.5%, 2%); }
  }
  .hero-inner{position:relative; padding-block:72px 40px; max-width:760px;}
  .hero h1{font-size:clamp(34px,5.6vw,60px); font-weight:800; margin-top:14px; letter-spacing:-0.02em;}
  .hero p.lead{margin-top:20px; font-size:17px; color:var(--header-muted); max-width:56ch;}
  .hero-cta{display:flex; gap:12px; margin-top:32px; flex-wrap:wrap;}

  /* ---------- Scroll reveal ---------- */
  .reveal{
    opacity:0; transform:translateY(22px);
    transition: opacity .6s cubic-bezier(.2,0,0,1), transform .6s cubic-bezier(.2,0,0,1);
  }
  .reveal.in-view{opacity:1; transform:none;}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1; transform:none; transition:none;}
    .hero::after{animation:none;}
  }

  /* ---------- Section shell ---------- */
  section{padding-block:72px;}
  section.tinted{background:var(--surface);}
  .section-head{max-width:640px; margin-bottom:36px;}
  .section-head h2{font-size:clamp(26px,3.4vw,36px); font-weight:800; margin-top:12px; letter-spacing:-0.01em;}
  .section-head p{margin-top:12px; color:var(--text-muted); font-size:15.5px;}

  /* ---------- About / pillars ---------- */
  .about-grid{display:grid; grid-template-columns: 1.1fr 1fr; gap:56px; align-items:start;}
  .about-grid p.body{color:var(--text-muted); font-size:15.5px; line-height:1.7;}
  .pillars{display:grid; grid-template-columns:repeat(2,1fr); gap:2px; background:var(--border);}
  .pillar{
    background:var(--surface-2); padding:18px; min-height:120px;
    display:flex; flex-direction:column; justify-content:space-between;
    transition: background .2s ease, transform .2s cubic-bezier(.2,0,0,1);
  }
  .pillar:hover{ background:var(--surface); transform:translateY(-3px); }
  .pillar .num{font-size:11px; font-weight:700; color:var(--text-soft); font-variant-numeric:tabular-nums;}
  .pillar h4{font-size:15px; font-weight:700; margin-top:10px;}
  .pillar p{font-size:12.5px; color:var(--text-muted); margin-top:6px;}
  .pillar-wide{grid-column:1 / -1; flex-direction:row; align-items:center; gap:16px;}
  .pillar-wide > div{display:flex; align-items:baseline; gap:10px;}
  .pillar-wide h4{margin-top:0;}
  .pillar-wide p{margin-top:0;}
  @media (max-width:800px){ .about-grid{grid-template-columns:1fr; gap:32px;} }
  @media (max-width:500px){ .pillars{grid-template-columns:1fr;} }

  /* ---------- Forum / event ---------- */
  .forum-card{
    background:var(--header-bg); color:var(--header-text); border-radius:3px; overflow:hidden;
    clip-path: polygon(0 0, calc(100% - 40px) 0, 100% 40px, 100% 100%, 0 100%);
  }
  .forum-top{padding:40px 40px 28px; display:flex; flex-direction:column; gap:14px; border-bottom:1px solid var(--header-border);}
  .forum-theme{font-size:clamp(22px,3vw,30px); font-weight:800; letter-spacing:-0.01em;}
  .forum-note{font-size:12.5px; color:var(--header-muted);}
  .forum-desc{font-size:14.5px; color:var(--header-muted); max-width:64ch; margin-top:4px;}
  .meta-list{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--header-border);}
  .meta-item{background:var(--header-bg); padding:20px 24px;}
  .meta-item .k{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--header-muted);}
  .meta-item .v{margin-top:8px; font-size:14.5px; font-weight:600;}
  @media (max-width:800px){ .meta-list{grid-template-columns:repeat(2,1fr);} }
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--header-border);}
  .stat-tile{background:var(--header-bg); padding:26px 24px; transition:background .2s ease;}
  .stat-tile:hover{background:#161616;}
  .stat-tile .val{font-size:clamp(28px,4vw,40px); font-weight:800; color:var(--red); font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
  .stat-tile .lbl{margin-top:6px; font-size:12.5px; color:var(--header-muted); line-height:1.4;}
  .stats-note{padding:14px 24px 28px; font-size:12px; color:var(--header-muted);}
  @media (max-width:700px){ .stat-row{grid-template-columns:repeat(2,1fr);} }

  /* ---------- Tickets ---------- */
  .tickets-grid{display:grid; grid-template-columns:1fr 1fr 1.1fr; gap:24px; align-items:start;}
  @media (max-width:980px){ .tickets-grid{grid-template-columns:1fr;} }
  .tier{
    background:var(--surface-2); border:1px solid var(--border); padding:28px;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%);
    display:flex; flex-direction:column; gap:16px; height:100%;
    transition: transform .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease, border-color .2s ease;
  }
  .tier:hover{ transform:translateY(-5px); box-shadow:0 16px 32px rgba(10,10,10,.10); border-color:var(--red); }
  .tier.vip{border-color:var(--red);}
  .tier-name{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-soft);}
  .tier-price{font-size:30px; font-weight:800; letter-spacing:-0.01em;}
  .tier-feats li{
    font-size:13.5px; color:var(--text-muted); padding-left:18px; position:relative; padding-block:4px;
  }
  .tier-feats li::before{content:""; position:absolute; left:0; top:11px; width:8px; height:2px; background:var(--red);}

  .order-card{background:var(--surface); border:1px solid var(--border); padding:28px;}
  .order-card h3{font-size:16px; font-weight:700;}
  .field{margin-top:16px; display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--text-muted);}
  .field input, .field select, .field textarea{
    height:48px; border:1px solid var(--border); border-radius:2px; padding:0 14px;
    font-size:14.5px; background:var(--surface-2); color:var(--text); font-family:inherit;
  }
  .field textarea{height:auto; padding:12px 14px; min-height:96px; resize:vertical;}
  .field select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23737373'/></svg>"); background-repeat:no-repeat; background-position:right 14px center;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:480px){ .row2{grid-template-columns:1fr;} }
  .epoint-badge{
    margin-top:18px; display:flex; align-items:center; gap:10px;
    border:1px dashed var(--border); padding:10px 12px; font-size:12px; color:var(--text-muted);
  }
  .epoint-badge b{color:var(--text); font-weight:700;}
  .order-error{margin-top:14px; font-size:13px; color:var(--red); font-weight:600;}
  .order-result{
    margin-top:18px; border:1px solid var(--border); background:var(--surface-2);
    padding:16px; font-size:13.5px; color:var(--text-muted); border-left:3px solid var(--red);
  }

  /* ---------- News ---------- */
  .news-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  @media (max-width:900px){ .news-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:640px){ .news-grid{grid-template-columns:1fr;} }
  .news-card{
    background:var(--surface-2); border:1px solid var(--border); display:flex; flex-direction:column;
    cursor:pointer; text-align:left; width:100%; padding:0; font-family:inherit;
    transition: transform .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease;
  }
  .news-card:hover{ transform:translateY(-5px); box-shadow:0 16px 32px rgba(10,10,10,.10); }
  .news-card:hover .news-link{ text-decoration:underline; }
  .news-media{height:8px; background:var(--red); overflow:hidden; position:relative;}
  .news-media::after{
    content:""; position:absolute; inset:0; background:#0A0A0A; opacity:.18;
    transform:translateX(-100%); transition:transform .35s cubic-bezier(.2,0,0,1);
  }
  .news-card:hover .news-media::after{ transform:translateX(0); }
  .news-body{padding:22px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .news-date{font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-soft); font-variant-numeric:tabular-nums;}
  .news-title{font-size:16.5px; font-weight:700; line-height:1.3;}
  .news-excerpt{font-size:13.5px; color:var(--text-muted); flex:1;}
  .news-link{font-size:12.5px; font-weight:700; color:var(--red); margin-top:6px;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,10,10,0); z-index:80;
    display:flex; align-items:flex-end; justify-content:center; padding:0;
    transition: background-color .22s ease;
  }
  .modal-backdrop.show{ background:rgba(10,10,10,.6); }
  @media (min-width:640px){ .modal-backdrop{align-items:center; padding:24px;} }
  .modal{
    background:var(--bg); color:var(--text); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
    border-top:4px solid var(--red);
    transform:translateY(24px); opacity:0;
    transition: transform .28s cubic-bezier(.2,0,0,1), opacity .22s ease;
  }
  .modal-backdrop.show .modal{ transform:translateY(0); opacity:1; }
  @media (prefers-reduced-motion: reduce){
    .modal-backdrop, .modal{ transition:none; }
  }
  @media (min-width:640px){ .modal{border-top-width:4px;} }
  .modal-inner{padding:28px;}
  .modal-close{
    float:right; background:transparent; border:1px solid var(--border); border-radius:2px;
    width:36px; height:36px; cursor:pointer; color:var(--text); font-size:16px;
  }
  .modal h3{font-size:22px; font-weight:800; margin-top:16px; clear:both;}
  .modal .news-date{margin-top:2px;}
  .modal p.body{margin-top:16px; font-size:15px; color:var(--text-muted); line-height:1.7;}

  /* ---------- University timeline ---------- */
  .timeline-cols{display:grid; grid-template-columns:1fr 1fr; gap:40px;}
  @media (max-width:760px){ .timeline-cols{grid-template-columns:1fr;} }
  .tl-year{font-size:13px; font-weight:800; color:var(--red); letter-spacing:.04em;}
  .tl-list{margin-top:16px; border-top:1px solid var(--border);}
  .tl-row{display:flex; gap:18px; padding:14px 4px; border-bottom:1px solid var(--border); align-items:baseline; transition:padding-left .18s ease, border-color .18s ease;}
  .tl-row:hover{padding-left:12px; border-color:var(--red);}
  .tl-date{flex:none; width:108px; font-size:13px; font-weight:700; color:var(--text-soft); font-variant-numeric:tabular-nums;}
  .tl-name{font-size:14.5px; font-weight:600;}
  .tl-note{margin-top:14px; font-size:12px; color:var(--text-soft);}

  /* ---------- Partners ---------- */
  .partners-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border);}
  @media (max-width:900px){ .partners-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .partners-grid{grid-template-columns:1fr;} }
  .partner-card{background:var(--surface-2); padding:20px; transition:background .2s ease, transform .2s cubic-bezier(.2,0,0,1);}
  .partner-card:hover{background:var(--surface); transform:translateY(-3px);}
  .partner-card h4{font-size:14.5px; font-weight:700;}
  .partner-card p{margin-top:6px; font-size:12.5px; color:var(--text-muted);}
  .partners-note{margin-top:20px; font-size:13px; color:var(--text-muted);}
  .partners-cta{margin-top:24px;}

  /* ---------- Sponsor logo waterfall ---------- */
  .sponsor-tag{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px;
    font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text-soft); border:1px dashed var(--border); padding:5px 10px;
  }
  .sponsor-tag::before{content:""; width:6px; height:6px; background:var(--red); flex:none;}
  .marquee-wrap{
    overflow:hidden; position:relative; margin-top:32px;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .marquee-track{
    display:flex; width:max-content;
    animation: marquee-scroll 32s linear infinite;
  }
  .marquee-wrap:hover .marquee-track{ animation-play-state:paused; }
  @keyframes marquee-scroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .marquee-item{
    flex:none; display:flex; align-items:center; justify-content:center;
    height:132px; padding:0 22px;
  }
  .logo-chip{
    background:#FFFFFF; border:1px solid var(--border);
    height:88px; min-width:150px; padding:14px 26px;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease, border-color .2s ease;
  }
  .marquee-item:hover .logo-chip{ transform:translateY(-3px); box-shadow:0 12px 24px rgba(10,10,10,.14); border-color:var(--red); }
  .logo-chip img{ max-height:52px; max-width:170px; width:auto; height:auto; object-fit:contain; display:block; }
  @media (prefers-reduced-motion: reduce){

  var currentLang = "az";
  try{
    var saved = localStorage.getItem("engx_lang");
    if(saved && translations[saved]) currentLang = saved;
  }catch(e){}

  function get(obj, path){
    return path.split(".").reduce(function(acc,k){ return (acc && acc[k]!==undefined) ? acc[k] : null; }, obj);
  }

  function applySimpleI18n(t){
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var val = get(t, el.getAttribute("data-i18n"));
      if(typeof val === "string") el.textContent = val;
    });
  }

  function renderPillars(t){
    var el = document.getElementById("pillars");
    var items = t.about.pillars;
    var isOdd = items.length % 2 === 1;
    el.innerHTML = items.map(function(p,i){
      var last = isOdd && i === items.length - 1;
      return '<div class="pillar reveal'+(last ? ' pillar-wide' : '')+'" style="transition-delay:'+(i*60)+'ms"><span class="num">0'+(i+1)+'</span><div><h4>'+esc(p.name)+'</h4><p>'+esc(p.desc)+'</p></div></div>';
    }).join("");
  }

  function renderForum(t){
    var ml = t.forum.metaLabels, m = t.forum.meta;
    var order = ["venue","date","duration","format"];
    document.getElementById("forumMeta").innerHTML = order.map(function(k){
      return '<div class="meta-item"><div class="k">'+esc(ml[k])+'</div><div class="v">'+esc(m[k])+'</div></div>';
    }).join("");
    document.getElementById("forumStats").innerHTML = t.forum.stats.map(function(s,i){
      var isNum = /^\d+$/.test(s.value);
      var valAttr = isNum ? ' data-count-target="'+s.value+'"' : '';
      var shown = isNum ? '0' : esc(s.value);
      return '<div class="stat-tile reveal" style="transition-delay:'+(i*70)+'ms"><div class="val"'+valAttr+'>'+shown+'</div><div class="lbl">'+esc(s.label)+'</div></div>';
    }).join("");
  }

  function renderTickets(t){
    var grid = document.getElementById("ticketsGrid");
    var orderCard = grid.querySelector(".order-card");
    var tiersHtml = t.tickets.tiers.map(function(tier,i){
      return '<div class="tier reveal'+(i===1?' vip':'')+'" style="transition-delay:'+(i*90)+'ms"><div><div class="tier-name">'+esc(tier.name)+'</div><div class="tier-price">'+esc(tier.price)+'</div></div><ul class="tier-feats">'+
        tier.features.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join("")+
        '</ul></div>';
    }).join("");
    grid.querySelectorAll(".tier").forEach(function(n){ n.remove(); });
    grid.insertAdjacentHTML("afterbegin", tiersHtml);

    var sel = document.getElementById("ord_type");
    sel.innerHTML = t.tickets.tiers.map(function(tier){
      return '<option value="'+esc(tier.name)+'">'+esc(tier.name)+' — '+esc(tier.price)+'</option>';
    }).join("");
  }

  function renderNews(t){
    var grid = document.getElementById("newsGrid");
    grid.innerHTML = t.news.items.map(function(item,i){
      return '<button type="button" class="news-card reveal" style="transition-delay:'+(i*80)+'ms" data-idx="'+i+'"><div class="news-media"></div><div class="news-body">'+
        '<div class="news-date">'+esc(item.date)+'</div><div class="news-title">'+esc(item.title)+'</div>'+
        '<div class="news-excerpt">'+esc(item.excerpt)+'</div><div class="news-link">'+esc(t.news.readMore)+' →</div>'+
        '</div></button>';

      card.addEventListener("click", function(){ openArticle(parseInt(card.getAttribute("data-idx"),10)); });

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function render(){
    var t = translations[currentLang];
    document.documentElement.setAttribute("lang", currentLang);
    applySimpleI18n(t);
    renderPillars(t);
    renderForum(t);
    renderTickets(t);
    renderNews(t);
    renderUniversity(t);
    renderPartners(t);
    renderSponsors(t);
    document.querySelectorAll(".langswitch button").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang")===currentLang ? "true":"false");
    });
    var orderResult = document.getElementById("orderResult");
    if(orderResult) orderResult.hidden = true;
    var orderError = document.getElementById("orderError");
    if(orderError) orderError.hidden = true;
    activateReveal();
  }

  function setLang(lang){
    if(!translations[lang]) return;
    currentLang = lang;
    try{ localStorage.setItem("engx_lang", lang); }catch(e){}
    var mainEl = document.querySelector("main");
    if(mainEl){
      mainEl.classList.add("lang-fade");
      window.setTimeout(function(){
        render();
        requestAnimationFrame(function(){ mainEl.classList.remove("lang-fade"); });
      }, 140);
    } else {
      render();
    }
  }

  document.querySelectorAll(".langswitch button").forEach(function(b){
    b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
  });

  // Mobile nav toggle
  var navToggle = document.getElementById("navToggle");
  var primaryNav = document.getElementById("primaryNav");
  navToggle.addEventListener("click", function(){
    var open = primaryNav.classList.toggle("open");
    navToggle.setAttribute("aria-expanded", open ? "true":"false");
  });
  primaryNav.querySelectorAll("a").forEach(function(a){
    a.addEventListener("click", function(){ primaryNav.classList.remove("open"); navToggle.setAttribute("aria-expanded","false"); });
  });

  // News modal
  var modalBackdrop = document.getElementById("modalBackdrop");
  function openArticle(idx){
    var t = translations[currentLang];
    var item = t.news.items[idx];
    if(!item) return;
    document.getElementById("modalDate").textContent = item.date;
    document.getElementById("modalTitle").textContent = item.title;
    document.getElementById("modalBody").textContent = item.body;
    modalBackdrop.hidden = false;
    requestAnimationFrame(function(){ modalBackdrop.classList.add("show"); });
    document.getElementById("modalClose").focus();
  }
  function closeModal(){
    modalBackdrop.classList.remove("show");
    window.setTimeout(function(){ modalBackdrop.hidden = true; }, 220);
  }
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", function(e){ if(e.target === modalBackdrop) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !modalBackdrop.hidden) closeModal(); });

  // Sticky header shadow on scroll
  var siteHeader = document.querySelector("header.site");
  function onScroll(){
    if(window.scrollY > 8) siteHeader.classList.add("scrolled");
    else siteHeader.classList.remove("scrolled");
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();

  // Scroll-reveal + stat count-up
  var reduceMotion = false;
  try{ reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

  function animateCount(el){
    var target = parseInt(el.getAttribute("data-count-target"), 10);
    if(isNaN(target)) return;
    if(reduceMotion){ el.textContent = target; return; }
    var start = null, duration = 900;
    function step(ts){
      if(start === null) start = ts;
      var p = Math.min((ts - start) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(eased * target);
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  var revealIO = null;
  try{
    revealIO = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add("in-view");
          var counter = entry.target.querySelector("[data-count-target]");
          if(counter) animateCount(counter);
          revealIO.unobserve(entry.target);
        }
      });
    }, {threshold:0.14, rootMargin:"0px 0px -30px 0px"});
  }catch(e){ revealIO = null; }

  function activateReveal(){
    var els = document.querySelectorAll(".reveal:not(.in-view)");
    if(!revealIO){
      els.forEach(function(el){
        el.classList.add("in-view");
        var counter = el.querySelector("[data-count-target]");
        if(counter) animateCount(counter);
      });
      return;
    }
    els.forEach(function(el){ revealIO.observe(el); });
  }

  // Order form (Epoint integration point)
  var orderForm = document.getElementById("orderForm");
  orderForm.addEventListener("submit", function(e){
    e.preventDefault();
    var t = translations[currentLang];
    var name = document.getElementById("ord_name").value.trim();
    var email = document.getElementById("ord_email").value.trim();
    var phone = document.getElementById("ord_phone").value.trim();
    var type = document.getElementById("ord_type").value;
    var qty = document.getElementById("ord_qty").value;
    var errorEl = document.getElementById("orderError");
    var resultEl = document.getElementById("orderResult");
    if(!name || !email || !phone || !type || !qty){
      errorEl.hidden = false;
      resultEl.hidden = true;
      return;
    }
    errorEl.hidden = true;
    /* --------------------------------------------------------------
       EPOINT INTEGRATION POINT
       Epoint requires a server-side call: the merchant secret key must
       sign the request (public_key + amount + currency + order_id →
       base64 + HMAC-SHA1 signature) before redirecting the shopper to
       Epoint's hosted checkout. That signing step cannot happen in
       this static front end without exposing the secret key, so this
       demo records the order client-side and shows a confirmation.
       To go live: POST {name,email,phone,type,qty} to your backend,
       have it call Epoint's /api/1/request and redirect to the
       returned checkout URL.
       -------------------------------------------------------------- */
    resultEl.textContent = t.tickets.integrationNotice + "  (" + type + " × " + qty + " — " + name + ")";
    resultEl.hidden = false;
  });

  var contactForm = document.getElementById("contactForm");
  contactForm.addEventListener("submit", function(e){
    e.preventDefault();
    var t = translations[currentLang];
    var resultEl = document.getElementById("contactResult");
    resultEl.textContent = t.contact.successNotice;
    resultEl.hidden = false;
    contactForm.reset();
  });

  document.getElementById("year").textContent = new Date().getFullYear();

  render();
})();
</script>
